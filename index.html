<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="todo">
        <h2>Daftar Tugas Kuliah</h2>
        <form id="formTugas">
            <input type="text" id="inputTugas" placeholder="Tulis Tugas Baru...">
            <button type="submit">Tambah</button>
        </form>
        <ul id="daftar"></ul>
        <button type="button" id="hapusSemua">Hapus Semua</button>
        <p id="info"></p>
    </div>
</body>
</html>
